# application.properties

# Configuracoes do Servidor
server.port=8080

# Nome da Aplicacao
spring.application.name=customer_service

# Configuracoes de Banco de Dados (PostgreSQL + Supabase/Render)
# As variaveis DB_URL, DB_USERNAME, DB_PASSWORD vem do Render
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:N!uiZH5T2pRudvm}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes JPA / Hibernate
# 'update' cria/ajusta tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuracoes JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=meuapp-jwt

# Actuator Endpoints (Monitoramento)
management.endpoints.web.exposure.include=*
management.endpoint.mappings.access=UNRESTRICTED
