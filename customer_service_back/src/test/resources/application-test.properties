# Configuracoes para o ambiente de teste (usando H2 em memoria com modo MySQL)

# Configuracoes do H2 Datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,VALUE # Adicionado NON_KEYWORDS
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Configuracoes do JPA / Hibernate para H2 com dialeto MySQL
# Usar o dialeto H2 é geralmente preferível quando em modo de compatibilidade,
# mas se encontrar problemas de sintaxe específicos do MySQL que o H2 não suporta bem,
# pode tentar o dialeto MySQL, embora possa levar a outros problemas.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Alternativa (menos comum para H2 em modo MySQL, mas pode testar se o H2Dialect falhar):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=create-drop
# Cria o schema ao iniciar os testes e apaga ao terminar
spring.jpa.show-sql=false
# Mudar para true se precisar de depurar o SQL gerado nos testes

# Para evitar problemas com o seu data.sql que é específico do MySQL
# e pode não ser totalmente compatível com H2 (mesmo em modo MySQL),
# é melhor desabilitar a inicialização de scripts SQL para os testes.
spring.sql.init.mode=never

# Desabilitar Flyway ou Liquibase para testes, se os estiver a usar (não parece ser o caso)
# spring.flyway.enabled=false
# spring.liquibase.enabled=false

# Outras propriedades de teste podem ser adicionadas aqui
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
