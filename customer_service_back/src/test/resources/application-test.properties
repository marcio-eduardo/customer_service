# Usar um banco de dados em memória H2 para os testes
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Usar o dialeto do H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Não é necessário mostrar o SQL durante os testes, a menos que esteja depurando
spring.jpa.show-sql=false

# 'create-drop' recria o schema a cada execução de teste, garantindo isolamento
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa a inicialização por scripts SQL para os testes
spring.sql.init.mode=never

# Segredo JWT para testes
app.jwt.secret=test-secret