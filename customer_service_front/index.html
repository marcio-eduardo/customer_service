<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- Você pode trocar o href abaixo pelo caminho do seu logo se ele estiver na pasta public, ex: /favicon.png -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título que aparece na aba do navegador -->
  <title>TAS - Trust Assist System</title>
  <meta name="description"
    content="Sistema de gerenciamento de chamados de TI e atendimento ao cliente focado em segurança e eficiência." />

  <!-- Open Graph / LinkedIn / Facebook -->
  <!-- Isso controla como o link aparece quando compartilhado -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tasystem.vercel.app/" />
  <meta property="og:title" content="TAS - Trust Assist System" />
  <meta property="og:description"
    content="Organizando o caos do suporte de TI. Sistema completo de Help Desk com Dashboard, gestão de tickets e segurança avançada." />
  <!-- Dica: Coloque uma imagem bonita chamada 'preview.png' na pasta 'public' do projeto para aparecer aqui -->
  <meta property="og:image" content="https://tasystem.vercel.app/preview.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://tasystem.vercel.app/" />
  <meta property="twitter:title" content="TAS - Trust Assist System" />
  <meta property="twitter:description"
    content="Organizando o caos do suporte de TI. Sistema completo de Help Desk com Dashboard, gestão de tickets e segurança avançada." />
  <meta property="twitter:image" content="https://tasystem.vercel.app/preview.png" />
</head>

  <div id="root"></div>

</html>
